name: cbt-imbs-saas-pilot

services:
  cbt-imbs-saas-pilot:
    build:
      context: .
      dockerfile: Dockerfile.render
      args:
        VITE_API_BASE_URL: ""
        VITE_SHOW_DEMO_ACCOUNTS: "false"
        VITE_TENANCY_ENABLED: "true"
    container_name: cbt-imbs-saas-pilot
    ports:
      - "127.0.0.1:8180:10000"
    environment:
      NODE_ENV: production
      PORT: "10000"
      TENANCY_ENABLED: "true"
      DB_HOST: cbt-imbs-db
      DB_PORT: "5432"
      DB_NAME: cbt_imbs
      DB_USER: cbt
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_POOL_MAX: "15"
      DB_CONNECTION_TIMEOUT_MS: "5000"
      DB_QUERY_TIMEOUT_MS: "5000"
      CONTROL_DB_HOST: cbt-imbs-db
      CONTROL_DB_PORT: "5432"
      CONTROL_DB_NAME: cbt_control_plane
      CONTROL_DB_USER: cbt_control_app
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD:?Set CONTROL_DB_PASSWORD in .env}
      CONTROL_DB_POOL_MAX: "5"
      TENANT_MASTER_KEY_FILE: /run/secrets/tenant_master.key
      TENANT_MAX_POOLS: "10"
      TENANT_POOL_MAX: "2"
      TENANT_POOL_TOTAL_MAX: "20"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      COOKIE_SECURE: "false"
      PUBLIC_BASE_URL: http://127.0.0.1:8180
      CORS_ORIGINS: http://127.0.0.1:8180
      LEGACY_BOOTSTRAP_SEED_ENABLED: "false"
      ROTATE_DEMO_SEED_PASSWORDS: "false"
      SEED_DEMO_STUDENTS: "false"
      QUESTION_MEDIA_DIR: /app/uploads/question-media
      QUESTION_MEDIA_MAX_TOTAL_BYTES: "1073741824"
    volumes:
      - ./secrets:/run/secrets:ro
      - saas-pilot-media:/app/uploads
    networks:
      - cbtimbs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 20s
    restart: "no"

networks:
  cbtimbs:
    external: true
    name: cbtimbs_default

volumes:
  saas-pilot-media:
    name: cbt-imbs-saas-pilot-media