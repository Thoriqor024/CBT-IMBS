<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
  <meta name="theme-color" content="#f6f7fb"/>
  <title>IMBS CBT — Panel Akademik</title>
  <style>
    .cbt-splash {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f7f8fb;
      color: #334155;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .cbt-splash-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 30px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }
    .cbt-splash-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #eaf6f1;
      color: #279a70;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      font-weight: 800;
      font-size: 20px;
    }
    .cbt-splash h1 {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
    }
    .cbt-splash p {
      margin: 0;
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }
    .cbt-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #e2e8f0;
      border-top-color: #258a63;
      border-radius: 50%;
      animation: cbt-spin 0.8s linear infinite;
      margin: 16px auto 0;
    }
    @keyframes cbt-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    // Global fallback for devices with old cached scripts or syntax errors
    window.addEventListener('error', function(e) {
      var root = document.getElementById('root');
      if (root && (!root.children.length || root.querySelector('.cbt-splash'))) {
        root.innerHTML = '<div class="cbt-splash"><div class="cbt-splash-card">' +
          '<div class="cbt-splash-logo" style="background:#fef2f2;color:#dc2626;">!</div>' +
          '<h1>Gagal Memuat Halaman</h1>' +
          '<p>Terdeteksi cache versi lama pada browser perangkat ini.<br><code style="font-size:11px;color:#64748b;background:#f1f5f9;padding:4px 8px;border-radius:4px;display:inline-block;margin-top:8px;max-width:100%;overflow-wrap:anywhere;">' + (e.message || 'Script initialization failed') + '</code></p>' +
          '<button onclick="resetCbtCache()" style="margin-top:18px;height:42px;width:100%;background:#258a63;color:#ffffff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;">Bersihkan Cache & Buka Ulang</button>' +
          '</div></div>';
      }
    });
    function resetCbtCache() {
      try { localStorage.clear(); } catch(e){}
      try { sessionStorage.clear(); } catch(e){}
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { caches.delete(k); });
        });
      }
      setTimeout(function() {
        window.location.reload(true);
      }, 300);
    }
  </script>
</head>
<body>
  <div id="root">
    <div class="cbt-splash">
      <div class="cbt-splash-card">
        <div class="cbt-splash-logo">🎓</div>
        <h1>IMBS CBT</h1>
        <p>Memuat sistem ujian dan ruang kerja akademik...</p>
        <div class="cbt-spinner"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
