    choice and latest unfinished notes to strengthen platform features/workflows
    consistently with existing style.
  acceptance_criteria:
    - Latest docs and selected Profile B are authoritative.
    - Implement in-scope incomplete work.
    - Preserve conventions.
    - Validate relevant changes.
  captured_at: "2026-10-06"

decisions:
  - Preserve pin-lifecycle as completed; its existing implementation and checks are not reopened.
  - Reassign profile-b-e2e to gem-implementer and use direct browser MCP against the three shared https://localhost:8443/ pages, avoiding the prior silent browser-tester invocation.
  - Profile-b-e2e verification and exact synthetic-record cleanup are complete; capacity-150 completed as a local measured baseline with no production-readiness claim.
  - Use available browser tooling; do not download or install tools unless execution establishes a concrete missing dependency.

assumptions:
  - The shared browser pages still target the local Docker deployment and can be inspected by the assigned executor.
  - Existing app/API/Admin workflows can create isolated synthetic fixtures; if exact-scope cleanup is not safely available, the executor stops before destructive cleanup and reports blocked.

