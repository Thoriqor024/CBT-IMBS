  - id: operations-guide-and-validation
    title: Document operating defaults and the next measured load test
    description: >-
      [reuse existing operational docs; do not create README] Update pengembangan.md
      with the selected per-process pool max (10), connection/query timeout defaults
      (1000/5000 ms), fixed 5000 ms JSON sample interval and fields, env overrides,
      multi-process aggregate connection budgeting, timeout response semantics,
      and the reason these are conservative starting points rather than universal
      capacity settings. Explain the secure scrape boundary: api:3000/metrics is
      reachable by Prometheus attached to the same Compose project network, the API
      port is not host-published, Nginx does not proxy the route, and public scraping
