      process, HTTP, and DB-pool metric families/samples. Confirm the API remains
      unpublished on host ports and Nginx/frontend does not expose metrics. The
      current Compose file publishes Prometheus on host port 9090; record that
      topology accurately without changing it. If the target is absent or cannot
      be queried, stop and report the precise blocker; do not start services or
      infer a successful scrape.
    wave: 3
    depends_on: []
    agent: gem-devops
    status: pending
    retries_used: 0
    acceptance_criteria:
