plan_id: 2026-10-06-pg-pool-metrics
status: blocked
tldr: |
  Reduce per-process PostgreSQL concurrency to a conservative 10-client starting
  point for the stated 2-core host, fail promptly on pool/query timeouts, emit
  pool and Prometheus metrics on the private Compose network, and document an
  operational runbook plus staged follow-up load test. Continue with live scrape
  verification, source-map-js dependency remediation, and a measured staged rerun.
  These settings are tunable hypotheses, not universal optima or a production-
  readiness claim.
created_at: "2026-10-06"
created_by: gem-planner
revision: 3
planner_revision_used: true
replan_count: 0

tasks:
  - id: pool-overload-and-metrics
    title: Bound PostgreSQL waits and expose low-cardinality metrics
    description: >-
      [reuse current Express/pg Pool and Node built-in test runner; add only the
      expressly requested prom-client dependency] Change the single-process
      DB_POOL_MAX fallback from 50 to 10, retaining the existing environment
      override and validation range. This is a conservative initial setting for
      the stated 2-core/4-thread, 24-GB host where API and PostgreSQL share CPU;
      it is not an optimality guarantee. Configure DB_CONNECTION_TIMEOUT_MS=1000
      mapped to node-postgres connectionTimeoutMillis and DB_QUERY_TIMEOUT_MS=5000
      mapped to its query timeout, with bounded, validated overrides. Classify
      only pool-acquisition and configured query-timeout failures as temporary
      overload: return HTTP 503, Retry-After: 1, a stable overload code and a
      non-sensitive message while preserving the existing string error field.
      Leave unrelated SQL/auth/schema failures on the existing generic-error
      path. Log one JSON pool sample every 5000 ms with an ISO timestamp and
      public totalCount/idleCount plus numeric waitingCount when exposed, otherwise
      null (never zero); feature-detect the property and do not inspect pg private
      internals. Make the sampler singleton/idempotent, unref its timer, and clear
      it during graceful shutdown. Add prom-client process collectors plus HTTP
      count and duration with bounded method, route-template and status labels.
      Use an explicit finite allowlist of common methods and map every other method
      to the fixed OTHER value; use normalized route templates with a fixed fallback
      for unmatched routes. Inventory existing instrumentation first and
      detect/avoid duplicate prom-client default HTTP instrumentation. Record
      exactly one counter increment and one histogram observation per eligible
      request; exclude /metrics from both. Do not use raw paths/IDs. Serve
      Prometheus text only on the API service's private Compose network: do not
      publish the API port and do not proxy /metrics through Nginx; explicitly
      return 404 for the public frontend /metrics path. Verify the locked
      pg@8.23.0 / pg-pool@3.14.0 public Pool API and the actual timeout error
      shapes before finalizing classification.
    wave: 1
    depends_on: []
    agent: gem-implementer
    status: completed
    retries_used: 1
    acceptance_criteria:
      - >-
        With one API process, DB_POOL_MAX defaults to 10, remains configurable,
        and timeout defaults are 1000 ms for acquisition and 5000 ms per query;
        invalid values safely fall back. The rationale accounts for the shared
        2-core host and states that there is no universal ideal pool size.
      - >-
        Pool acquisition and configured query timeouts produce HTTP 503 with
        Retry-After: 1, stable structured overload metadata, no driver/internal
        error leakage, and the existing string error field. Tests demonstrate
        unrelated database failures do not become overload responses.
      - >-
        JSON pool samples occur on a 5000 ms interval and contain timestamp,
        totalCount, idleCount, and waitingCount; unavailable waitingCount is null
        with availability made explicit, and no private pg internals are read.
        Repeated sampler start/stop does not create duplicate intervals or keep
        Node alive.
      - >-
        GET /metrics exports Prometheus text with process CPU, memory and heap
        collectors plus HTTP request count and duration. The implementation uses
        an explicit finite common-method allowlist with every other method mapped
        to OTHER, and a fixed fallback for unmatched normalized routes; varying IDs
        do not increase label cardinality. Existing instrumentation is inventoried
        and duplicate prom-client default HTTP instrumentation is avoided. Each
        eligible request increments the counter once and observes the histogram
        once; /metrics is excluded from both. Focused tests prove these exactly-once
        and exclusion properties.
      - >-
        The API's Compose port remains unpublished, Nginx does not proxy the
        metrics endpoint and the public frontend path returns no Prometheus data.
        Document the same-project-network target api:3000/metrics and scrape
        configuration. Validation uses static Compose configuration/topology checks
        and route tests; it may inspect an already-running Prometheus in the same
        project, but must not start any service. If no such scraper is already
        running, defer live scrape evidence to the next load test and report that
        deferral rather than starting services.
      - >-
        Focused Node tests cover timeout mapping, metrics access/content,
        finite method and route fallbacks, cardinality bounds, exactly-once counter
        and histogram behavior for eligible requests, /metrics exclusion and sampler
        behavior. No test-only production route or additional testing dependency is
        introduced.
    handoff:
      completion_resolution:
        status: completed
        wave_2_unblocked: true
        acceptance_assessment: >-
          The wave-1 pool, timeout, metrics, and topology acceptance criteria are
          met. The focused suite is recorded as 9/9 passing; Node syntax checks,
          npm build, and static topology checks passed. The npm audit finding is
          not a wave-1 acceptance criterion and does not prevent proceeding to
          wave 2.
        dependency_security_follow_up: >-
          Keep separate from this task: source-map-js@1.2.1 is in the existing
          Vite 8.3.1 -> PostCSS 8.5.28 dependency path, while prom-client's
          dependency tree does not include Vite or PostCSS. update.md records
          Vite 8.3.1 before this task, but this workspace has no .git directory
          to establish the exact historical lockfile state. The API image runs
          npm ci --omit=dev, but Vite is declared under dependencies, so the
          finding remains relevant to the production image. Do not alter
          dependency versions or classification here; track a separate
          dependency-security task.
      constraints:
        - >-
          Preserve current public API behavior except the required additive 503
          overload fields; never expose raw PostgreSQL or timeout error messages.
        - >-
          Preserve private Compose-only metrics access; do not add a public port,
          route metrics through Nginx, or add a Prometheus service as part of this
          scope.
        - >-
          Use only public pg.Pool counters and feature-detect waitingCount; null
          means unavailable and must never be reported as zero.
        - >-
          One pool exists per API process. Document/reason about aggregate
          connection budget as API replica/process count times per-process max,
          plus other clients, against PostgreSQL max_connections=100.
        - >-
          Do not run destructive Docker operations, remove volumes, or perform
          database cleanup as part of focused validation.
      relevant_context:
        - >-
          server/db.js currently defaults DB_POOL_MAX to 50, caps configured
          values at 200, and has idleTimeoutMillis=30000; it has no connection
          or query timeout configuration.
        - >-
          server/index.js has one Express app, central error middleware near the
          end, and starts initialization/listening at module top level. Testable
          route/module boundaries may be needed, but avoid a broad server rewrite.
        - >-
          docker-compose.yml runs one api service next to postgres:17-alpine;
          the API has no published ports. Nginx publishes only frontend 80/443
          (host 8080/8443) and proxies only /api/.
        - >-
          package-lock.json pins pg 8.23.0 and pg-pool 3.14.0; package.json has
          no test script/framework. Use node:test/node:assert before adding any
          other dependency. prom-client is explicitly authorized.
        - >-
          update.md and the capacity artifact record 1,260 successful lifecycle
          requests and 24 monitor polls, zero errors/429/inconsistencies, pool
          max 50/50 at cohorts 50 and 150, up to 48 active DB connections at 150,
          26.68 s start p95 and 14.24 s monitor p95. Previous resource sampling
          was sparse and the host hardware was not recorded for that run.
        - >-
          The user now supplies Intel i3-7100 (2 cores/4 threads) and 24 GB RAM;
          API and PostgreSQL share this host. Prior latency can also reflect CPU
          work (including bcrypt), so pool occupancy alone does not prove cause.
        - >-
          pengembangan.md already requires a staged 10/50/150 load test, p50/p95/p99,
          errors/429, DB queue/lock pressure, API/database CPU and memory, and
          owner-agreed thresholds before any go/no-go claim.
      high_risk_signals:
        - api_change
        - shared_state
      critic_signals: []

