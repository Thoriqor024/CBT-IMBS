        - shared_state
      critic_signals: []

review_blocker:
  task_id: instrumented-capacity-rerun
  finding: >-
    The plan review is blocking because the load-test handoff could be read as
    permitting API or Prometheus lifecycle changes without separate authorization.
    The plan has already used its single allowed planner revision, so execution is
    paused for user direction. No follow-up scrape, audit, remediation, or load test
    has started in this extension.
  reviewer_action: >-
    Clarify that all service start/stop/recreate/reconfigure actions require separate
    explicit user authorization; preserve database and volume protections.