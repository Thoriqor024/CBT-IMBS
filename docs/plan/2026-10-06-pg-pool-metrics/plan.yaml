          Follow the audit task's evidence; if no compatible fix is established,
          do not guess a version and report blocked with residual risk.
        - >-
          Do not run blanket npm audit fix, upgrade unrelated dependencies, or
          change application behavior unrelated to the finding.
        - >-
          Do not stop/recreate the database, remove volumes, or restart running
          services; use image/build checks that leave the current stack intact.
      relevant_context:
