      high_risk_signals:
        - security_sensitive
        - shared_state
      critic_signals: []

  - id: source-map-js-audit
    title: Establish the source-map-js advisory and compatible fix path
    description: >-
      [reuse npm audit and the existing lockfile; investigation only] Inspect the
      current npm audit report, npm dependency explanation, package.json, and
      package-lock.json for source-map-js. Confirm the exact advisory IDs/severity,
      installed and required versions, dependency path through Vite/PostCSS,
      whether the affected packages enter npm ci --omit=dev in server/Dockerfile,
      and the smallest fixed version or dependency classification compatible with
      the current Vite and build. Do not modify dependencies in this task and do
      not run broad upgrades. Return the evidence and remediation recommendation
      for the dependent implementation task; include residual risk if no compatible
      fix exists.
    wave: 3
    depends_on: []
    agent: gem-reviewer
    status: pending
    retries_used: 0
    acceptance_criteria:
