        - >-
          server/Dockerfile performs npm ci --omit=dev before copying server;
          the fixed lock resolution must remain installable in this production
          image path.
      high_risk_signals:
        - security_sensitive
      critic_signals: []

  - id: instrumented-capacity-rerun
    title: Rerun staged lifecycle load with pool and resource evidence
    description: >-
      [reuse scripts/capacity-load.mjs and synthetic fixtures; minimal evidence
      collector changes only if required] After live metrics and dependency/image
      validation, inspect the current running stack and harness preflight before
      any fixture mutation. Run staged 10/50/150 synthetic participant lifecycle
      traffic with the new API instrumentation. Capture p50/p95/p99, success/error/
     429 counts, direct API pool JSON samples (totalCount, idleCount,
      waitingCount/availability), Prometheus HTTP/process metric evidence, and
      API/PostgreSQL CPU and memory samples; verify lifecycle and answer
      consistency. Retain per-stage evidence and use the harness's exact-ID
      deterministic cleanup. Preserve baseline records, database, and volume
      identities. If live topology differs from harness assumptions or preflight
      cannot establish exact target/cleanup scope, stop before fixture creation.
      Report observations only; owner thresholds are not supplied.
    wave: 5
    depends_on:
      - live-prometheus-scrape
      - source-map-js-remediation
    agent: gem-devops
    status: pending
    retries_used: 0
    acceptance_criteria:
      - >-
        The current local Compose target, running API/database identities,
        healthy DB, mounted volume identities, baseline table counts, and
        marker collision-free state are verified by preflight before mutation;
        mismatch blocks the run before fixture creation.
      - >-
        The existing harness completes cohorts of 10, 50, and 150 synthetic
        participants and captures lifecycle request/poll latency p50/p95/p99,
        success/error/429 counts, answer consistency, and per-stage API/PostgreSQL
        CPU and memory samples.
      - >-
        Evidence includes direct pool JSON samples for totalCount, idleCount,
        waitingCount and its availability semantics, plus scrape/instrumentation
        samples; unavailable waitingCount remains null and is never inferred as 0.
      - >-
        Deterministic cleanup removes only manifest-verified synthetic fixture
        IDs; post-run baseline counts and volume identities match preflight, and
        no database/volume is stopped, recreated, or deleted.
      - >-
        Results include limitations and comparison to the prior local baseline;
        no go/no-go or production-readiness claim is made without owner-agreed
        thresholds.
    handoff:
      constraints:
        - Use synthetic accounts/exams only; never touch real student data.
        - >-
          Preserve the current Compose topology and every running service,
          including Prometheus, API, and database. Do not start, stop, recreate,
          or reconfigure any service without separate explicit user authorization.
          Do not delete volumes or mutate real student data.
        - >-
          Use the existing harness cleanup manifest and exact-ID assertions;
          if cleanup cannot be verified, stop and report without broad deletion.
        - >-
          Do not invent school performance thresholds or claim production
          readiness from a local host run.
      relevant_context:
        - >-
          scripts/capacity-load.mjs stages 10/50/150 and snapshots baseline table
          counts, checks the local Compose project and DB health, creates 211
          marker-prefixed synthetic users, 3 exams and 210 sessions, measures
          p50/p95/p99 and samples API/PostgreSQL Docker CPU/memory plus pg_stat_activity.
        - >-
          The harness deletes only validated IDs and verifies post-cleanup table
          counts and volume identities; its current pool proxy does not expose
          direct node-postgres waitingCount, so collect the new 5-second API JSON
          pool logs and Prometheus samples rather than treating pg_stat_activity
          as an equivalent.
        - >-
          Prior local baseline recorded 1,260 lifecycle successes, 24 monitor
          polls, no errors/429/inconsistencies, start p95 26.68 s, monitor p95
          14.24 s, old 50/50 pool occupancy, and up to 48 active DB connections;
          it is host-specific and not an acceptance threshold.
      high_risk_signals:
        - security_sensitive
        - shared_state
      critic_signals: []

