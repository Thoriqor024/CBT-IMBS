      new pool wait/active/idle metrics, process and DB CPU/memory, HTTP latency and
      overload responses alongside the existing lifecycle harness; require the
      owner to set thresholds and preserve the prior baseline for comparison. State
      explicitly that an i3-7100 result cannot certify another host or production.
      Append a concise dated implementation/progress entry to update.md per project
      convention. Validate focused tests, Node syntax, npm build and docker compose
      config without bringing down services, deleting data or claiming production
      readiness.
    wave: 2
    depends_on:
      - pool-overload-and-metrics
    agent: gem-implementer
    status: completed
    retries_used: 0
    acceptance_criteria:
      - >-
        pengembangan.md states all chosen defaults and override environment
        variables, sample JSON shape, timeout response behavior, aggregate pool
        budget, and why no universal pool optimum is claimed.
      - >-
        The operational guide explains how same-network Prometheus reaches
        api:3000/metrics, why host/public access is unavailable, and that the
        Nginx/frontend path is not a scrape endpoint.
      - >-
        A staged 10/50/150 load-test to-do captures request percentiles and errors,
        pool waiting/total/idle observations, API and PostgreSQL resources, and
        comparison with the recorded baseline; it leaves acceptance thresholds
        to the school and makes no production-readiness claim.
      - >-
