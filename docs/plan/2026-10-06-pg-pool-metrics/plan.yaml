        The existing Prometheus target for api:3000/metrics is reported UP with
        a successful scrape and observed scrape timestamp; if not, task is
        blocked with evidence and no services are started or recreated.
      - >-
        Evidence records the metrics HTTP content type and representative
        process CPU/memory, HTTP request/latency, and DB pool metric families
        with sample values, without exposing credentials or sensitive labels.
      - >-
        Current topology is checked: API has no host-published port and the
        frontend/Nginx route does not serve metrics. Prometheus host port 9090
        is recorded as currently configured; no port or proxy changes are made.
    handoff:
      constraints:
        - >-
          Prometheus running is user-supplied context; verify its actual current
          target state before reporting success.
        - >-
          Do not start, stop, recreate, or reconfigure services. Do not publish
          the API or expose its /metrics route publicly.
        - Preserve the current user-edited Compose topology.
      relevant_context:
